name: build-test-publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/trembon/subtitlecleanup

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SubtitleCleanUp.slnx
      - run: dotnet build SubtitleCleanUp.slnx --configuration Release --no-restore
      - name: Core line coverage
        run: >
          dotnet test tests/SubtitleCleanUp.Core.Tests/SubtitleCleanUp.Core.Tests.csproj
          --configuration Release --no-build
          /p:CollectCoverage=true
          /p:Threshold=80
          /p:ThresholdType=line
      - name: Core branch coverage
        run: >
          dotnet test tests/SubtitleCleanUp.Core.Tests/SubtitleCleanUp.Core.Tests.csproj
          --configuration Release --no-build
          /p:CollectCoverage=true
          /p:Threshold=70
          /p:ThresholdType=branch
      - name: Application tests
        run: dotnet test tests/SubtitleCleanUp.Web.Tests/SubtitleCleanUp.Web.Tests.csproj --configuration Release --no-build

  container:
    name: Build and publish container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest published image
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
